name: TWM CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:22-alpine
    permissions:
      checks: write
      pull-requests: write
      contents: write
    steps:
    - name: Install git and bash
      run: apk add --no-cache git bash
    - uses: actions/checkout@v2
    - name: Git Workaround
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install dependencies
      run: |
        npm ci
    - name: Run tests
      run: |
        npm test
    - name: Test Report
      uses: dorny/test-reporter@v3
      if: ${{ !cancelled() }}
      with:
        name: JEST Tests
        path: reports/junit/junit.xml
        reporter: jest-junit

